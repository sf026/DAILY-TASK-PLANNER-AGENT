<!DOCTYPE html>
<html>
<head>
    <title>Daily Task Planner Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🗓️ Daily Task Planner</h1>

        <form method="POST">
            <textarea name="tasks" placeholder="Enter your daily tasks separated by commas" required></textarea>
            <button type="submit">Generate Plan</button>
        </form>

        {% if plan %}
        <div class="output">
            <h2>Your Daily Plan</h2>
            <pre>{{ plan }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
